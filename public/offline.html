<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çevrimdışısınız — neonsform</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0d14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(22, 27, 46, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 24px;
      box-shadow: 0 0 40px -10px rgba(34, 211, 238, 0.2);
    }
    .icon-wrapper {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: #22d3ee;
    }
    .icon-wrapper svg {
      width: 32px;
      height: 32px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 40%, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 12px;
      background: #22d3ee;
      color: #0b0d14;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #67e8f9;
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
    }
    .info {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364m0 0L3 3m5.636 5.636a5 5 0 011.414-3.536m0 0a5 5 0 013.536-1.414" />
      </svg>
    </div>
    <h1>İnternet Bağlantısı Yok</h1>
    <p>neonsform şu anda çevrimdışı modda. Önceden ziyaret ettiğiniz konular önbelleğe kaydedildi. Bağlantınız geldiğinde sistem otomatik olarak eşitlenecektir.</p>
    <button class="btn" onclick="window.location.reload()">
      Tekrar Dene
    </button>
    <div class="info">
      neonsform.com PWA &bull; Çevrimdışı Önbellek Aktif
    </div>
  </div>
</body>
</html>
